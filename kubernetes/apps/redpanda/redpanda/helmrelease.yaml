---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name redpanda
spec:
  interval: 12h
  timeout: 5m
  chart:
    spec:
      chart: *name
      sourceRef:
        kind: HelmRepository
        name: *name
      version: 26.3.1
  install:
    crds: CreateReplace
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: redpanda-console
            patch: |-
              - op: remove
                path: /spec/replicas
  valuesFrom:
    - kind: ConfigMap
      name: redpanda-helm-values
