# yaml-language-server: $schema=https://raw.githubusercontent.com/not-first/glance-schema/master/schema.json#/properties/pages
- name: News
  desktop-navigation-width: slim
  columns:
    - size: full
      widgets:
        # ── UIT ──────────────────────────────────────────────────────
        - type: rss
          title: UIT
          style: detailed-list
          cache: 1h
          feeds:
            - url: https://www.uit.edu.vn/taxonomy/term/83/feed
              title: General Notifications
            - url: https://www.uit.edu.vn/taxonomy/term/87/feed
              title: UIT News
            - url: https://www.uit.edu.vn/taxonomy/term/202/feed
              title: Study
            - url: https://www.uit.edu.vn/taxonomy/term/201/feed
              title: Student Activities

        # ── UIT Forum ───────────────────────────────────────────────
        - type: rss
          title: UIT Forum
          style: detailed-list
          cache: 1h
          feeds:
            - title: Posts
              url: https://forum.uit.edu.vn/posts.rss
            - title: Latest Topics
              url: https://forum.uit.edu.vn/latest.rss
            - title: Internship
              url: https://forum.uit.edu.vn/c/ho-tro-doi-song/viec-lam-thuc-tap/32.rss
            - title: Companies
              url: https://forum.uit.edu.vn/c/ho-tro-doi-song/hoi-thao-tham-quan-doanh-nghiep-cac-cuoc-thi/33.rss
            - title: Software Faculty
              url: https://forum.uit.edu.vn/c/goc-hoc-tap/cong-nghe-phan-mem/20.rss
            - title: Network Faculty
              url: https://forum.uit.edu.vn/c/cong-dong-uit/10.rss

        # ── Forum + YouTube (side by side) ──────────────────────────
        - type: split-column
          widgets:
            # ── Forum ─────────────────────────────────────────────
            - type: rss
              title: Forum
              style: detailed-list
              cache: 1h
              feeds:
                - title: Voz Chuyện trò linh tinh
                  url: https://voz.vn/f/chuyen-tro-linh-tinh.17/index.rss
                - title: Voz Tuyển dụng tìm việc
                  url: https://voz.vn/f/tuyen-dung-tim-viec.95/index.rss
                - title: Voz Lập trình CNTT
                  url: https://voz.vn/f/lap-trinh-cntt.91/index.rss
                - title: r/vozforums
                  url: https://www.reddit.com/r/vozforums/.rss
                - title: r/neovim
                  url: https://www.reddit.com/r/neovim/.rss

            # ── YouTube: Tech ─────────────────────────────────────
            - type: videos
              title: YouTube - Tech
              style: horizontal-cards
              cache: 1h
              limit: 15
              channels:
                # TheLinuxNinja
                - UC3ECq823SyuR1Is4zhxfuOA
                # devopstoolbox
                - UCYeiozh-4QwuC1sjgCmB92w
                # yousuckatprogramming
                - UCMN0a7GHQnC6H74SmCGSmdw
                # vinamuse203
                - UC7aT5OieA6-AGD48qZCDnUA

            # ── YouTube: Blog ─────────────────────────────────────
            - type: videos
              title: YouTube - Blog
              style: horizontal-cards
              cache: 1h
              limit: 10
              channels:
                # tumivn
                - UChfAI8bOPOJIQOTE-qHRwew
