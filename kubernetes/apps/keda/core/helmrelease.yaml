---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-core
spec:
  releaseName: keda
  interval: 12h
  timeout: 5m
  chart:
    spec:
      chart: keda
      version: 2.21.1
      sourceRef:
        kind: HelmRepository
        name: keda
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
