---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-http
spec:
  releaseName: keda-add-ons-http
  interval: 12h
  timeout: 5m
  chart:
    spec:
      chart: keda-add-ons-http
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: keda
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: keda-http-helm-values
