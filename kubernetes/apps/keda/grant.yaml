---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda-grant
  namespace: flux-system
spec:
  interval: 12h
  retryInterval: 1m
  timeout: 5m
  prune: true
  dependsOn:
    - name: default-gatewayapi
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: kubernetes/apps/keda/grant/
