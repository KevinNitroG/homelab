---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/schema-catalog/main/catalog/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook
spec:
  parentRefs:
    - name: default
      namespace: istio-system
      sectionName: https-wildcard
      kind: Gateway
  hostnames:
    - flux-webhook.${PUBLIC_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
