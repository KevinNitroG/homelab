---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capacitor
spec:
  suspend: true
  releaseName: capacitor
  interval: 12h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: capacitor
  values:
    env:
      AUTH: oidc
      AUTHORIZED_EMAILS: "${CAPACITOR_ALLOWED_EMAIL}"
      OIDC_ISSUER: https://authentik.${PUBLIC_DOMAIN}/application/o/capacitor/
      OIDC_CLIENT_ID: capacitor
      OIDC_REDIRECT_URL: https://capacitor.${PUBLIC_DOMAIN}/auth/callback
      OIDC_SCOPES: openid,profile,email
      OIDC_GROUPS_CLAIM: groups
      OIDC_GROUP_PREFIX: "authentik:capacitor:"
      FLUXCD_NAMESPACE: flux-system
    existingSecret:
      name: capacitor
    serviceAccount:
      name: capacitor
    ingress:
      enabled: false
    permissionElevation:
      workloadRestartNamespaces: []
      fluxReconciliationNamespaces: []
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: capacitor-impersonator
            patch: |
              - op: replace
                path: /rules
                value:
                  - apiGroups: [""]
                    resources: ["users"]
                    resourceNames: ["${CAPACITOR_ALLOWED_EMAIL}"]
                    verbs: ["impersonate"]
                  - apiGroups: [""]
                    resources: ["groups"]
                    resourceNames:
                      - "authentik:capacitor:Capacitor Viewers"
                      - "authentik:capacitor:Capacitor Editors"
                      - "authentik:capacitor:Capacitor Admins"
                    verbs: ["impersonate"]
