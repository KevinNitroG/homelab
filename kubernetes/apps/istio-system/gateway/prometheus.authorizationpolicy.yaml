# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/schema-catalog/main/catalog/security.istio.io/authorizationpolicy_v1.json
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-prometheus
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default
  action: CUSTOM
  provider:
    name: authentik
  rules:
    - to:
        - operation:
            hosts:
              - prometheus.*
