---
secret:
  rustfs:
    access_key: ${RUSTFS_ACCESS_KEY}
    secret_key: ${RUSTFS_SECRET_KEY}

config:
  rustfs:
    # domains:
    #   - https://${PUBLIC_DOMAIN}
    log_level: warn
    obs_endpoint:
      trace:
        enabled: true
        endpoint: http://alloy-alloy.monitoring:4317
      log:
        enabled: true
        endpoint: http://alloy-alloy.monitoring:4317
mode:
  distributed:
    enabled: false
  standalone:
    enabled: true

resource:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

storageclass:
  dataStorageSize: 10Gi
