---
secret:
  rustfs:
    access_key: ${RUSTFS_ACCESS_KEY}
    secret_key: ${RUSTFS_SECRET_KEY}

config:
  rustfs:
    # domains:
    #   - https://${PUBLIC_DOMAIN}
    log_level: warn
    obs_endpoint:
      trace:
        enabled: true
        endpoint: http://alloy-alloy.monitoring:4317
      log:
        enabled: true
        endpoint: http://alloy-alloy.monitoring:4317

extraEnv:
  - name: RUSTFS_OUTBOUND_ALLOW_ORIGINS
    value: https://authentik.${PUBLIC_DOMAIN}
  - name: RUSTFS_BROWSER_REDIRECT_URL
    value: https://rustfs.${PUBLIC_DOMAIN}
  - name: RUSTFS_IDENTITY_OPENID_ENABLE_authentik
    value: "on"
  - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL_authentik
    value: https://authentik.${PUBLIC_DOMAIN}/application/o/rustfs/.well-known/openid-configuration
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID_authentik
    valueFrom:
      secretKeyRef:
        name: rustfs-oidc
        key: client-id
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET_authentik
    valueFrom:
      secretKeyRef:
        name: rustfs-oidc
        key: client-secret
  - name: RUSTFS_IDENTITY_OPENID_SCOPES_authentik
    value: openid,profile,email,entitlements
  - name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME_authentik
    value: roles
  - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM_authentik
    value: roles
  - name: RUSTFS_IDENTITY_OPENID_ROLES_CLAIM_authentik
    value: roles
  - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM_authentik
    value: preferred_username
  - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME_authentik
    value: Authentik
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_authentik
    value: https://rustfs.${PUBLIC_DOMAIN}/rustfs/admin/v3/oidc/callback/authentik
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC_authentik
    value: "off"
mode:
  distributed:
    enabled: false
  standalone:
    enabled: true

resource:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

storageclass:
  dataStorageSize: 10Gi
