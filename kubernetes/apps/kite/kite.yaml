---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kite-kite
  namespace: flux-system
spec:
  interval: 12h
  retryInterval: 1m
  timeout: 1m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: kubernetes/apps/kite/kite/
  dependsOn:
    - name: kite-cnpg
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: clustersetting
      - kind: ConfigMap
        name: clustersetting
