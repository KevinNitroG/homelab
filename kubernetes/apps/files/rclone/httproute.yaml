---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rclone-http
spec:
  parentRefs:
    - name: default
      sectionName: http-wildcard
      kind: Gateway
      namespace: istio-system
    - name: default
      sectionName: http-wildcard-local
      kind: Gateway
      namespace: istio-system
  hostnames:
    - rclone.${PUBLIC_DOMAIN}
    - rclone.${LOCAL_DOMAIN}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rclone-https
spec:
  parentRefs:
    - name: default
      sectionName: https-wildcard
      kind: Gateway
      namespace: istio-system
    - name: default
      sectionName: https-wildcard-local
      kind: Gateway
      namespace: istio-system
  hostnames:
    - rclone.${PUBLIC_DOMAIN}
    - rclone.${LOCAL_DOMAIN}
  rules:
    - backendRefs:
        - name: files-rclone
          port: 8080
