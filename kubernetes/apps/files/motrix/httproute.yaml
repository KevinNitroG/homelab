---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: motrix-http
spec:
  parentRefs:
    - name: default
      sectionName: http-wildcard
      kind: Gateway
      namespace: istio-system
    - name: default
      sectionName: http-wildcard-local
      kind: Gateway
      namespace: istio-system
  hostnames:
    - motrix.${PUBLIC_DOMAIN}
    - motrix.${LOCAL_DOMAIN}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: motrix-https
spec:
  parentRefs:
    - name: default
      sectionName: https-wildcard
      kind: Gateway
      namespace: istio-system
    - name: default
      sectionName: https-wildcard-local
      kind: Gateway
      namespace: istio-system
  hostnames:
    - motrix.${PUBLIC_DOMAIN}
    - motrix.${LOCAL_DOMAIN}
  rules:
    - backendRefs:
        - name: motrix
          port: 8080
