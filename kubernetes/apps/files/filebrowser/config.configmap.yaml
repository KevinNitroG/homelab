# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
data:
  # language: yaml
  config.yaml: |
    address: 0.0.0.0
    port: 80
    root: /srv
    database: /database/filebrowser.db
    auth:
      method: json
    log: stdout
    defaults:
      scope: /srv
