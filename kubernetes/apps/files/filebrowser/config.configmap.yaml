# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/secret.json
apiVersion: v1
kind: Secret
metadata:
  name: filebrowser-config
stringData:
  # language: yaml
  config.yaml: |
    address: 0.0.0.0
    port: 80
    root: /srv
    database: /database/filebrowser.db
    auth:
      methods:
        noauth: false
    log: stdout
    defaults:
      scope: /srv
