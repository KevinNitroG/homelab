---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/schema-catalog/main/catalog/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: filebrowser
spec:
  scaleTargetRef:
    name: filebrowser-filebrowser
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: filebrowser
