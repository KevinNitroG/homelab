---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capacitor
  namespace: flux-system
spec:
  interval: 12h
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: kubernetes/apps/capacitor/
  dependsOn:
    - name: clustersettings
    - name: authentik-authentik
    - name: istio-system-gateway
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      CAPACITOR_ALLOWED_EMAIL: replace-me@example.invalid
    substituteFrom:
      - kind: Secret
        name: clustersetting
      - kind: ConfigMap
        name: clustersetting
