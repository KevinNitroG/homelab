---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/schema-catalog/main/catalog/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: lokistack
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folderRef: logging
  grafanaCom:
    id: 14055
    revision: 5
  datasources:
    - inputName: DS_LOKI
      datasourceName: Loki
