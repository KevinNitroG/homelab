---
- name: Check if chaotic-aur is already configured
  ansible.builtin.command: grep -q "\[chaotic-aur\]" /etc/pacman.conf
  register: chaotic_aur_check
  changed_when: false
  failed_when: false

- name: Import chaotic-aur GPG key
  ansible.builtin.command: pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
  when: chaotic_aur_check.rc != 0
  changed_when: true

- name: Sign chaotic-aur GPG key
  ansible.builtin.command: pacman-key --lsign-key 3056513887B78AEB
  when: chaotic_aur_check.rc != 0
  changed_when: true

- name: Install chaotic-keyring
  community.general.pacman:
    name: "https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst"
    state: present
  when: chaotic_aur_check.rc != 0

- name: Install chaotic-mirrorlist
  community.general.pacman:
    name: "https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst"
    state: present
  when: chaotic_aur_check.rc != 0

- name: Add chaotic-aur repository to pacman.conf
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    line: "{{ item }}"
    insertafter: EOF
  loop:
    - ""
    - "[chaotic-aur]"
    - "Include = /etc/pacman.d/chaotic-mirrorlist"
  when: chaotic_aur_check.rc != 0

- name: Update pacman cache after adding chaotic-aur
  community.general.pacman:
    update_cache: true
  when: chaotic_aur_check.rc != 0
