---
- name: Check if yay is installed
  ansible.builtin.command: which yay
  register: yay_check
  changed_when: false
  failed_when: false

- name: Create AUR builder user
  ansible.builtin.user:
    name: aurbuilder
    groups: wheel
    create_home: true
  when: yay_check.rc != 0

- name: Allow aurbuilder to use pacman without password
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/aurbuilder
    line: "aurbuilder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"
  when: yay_check.rc != 0

- name: Clone yay repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay-bin.git
    dest: /tmp/yay-bin
    version: master
  become: true
  become_user: aurbuilder
  when: yay_check.rc != 0

- name: Build and install yay
  ansible.builtin.command: makepkg -si --noconfirm
  args:
    chdir: /tmp/yay-bin
  become: true
  become_user: aurbuilder
  when: yay_check.rc != 0
  register: yay_build
  changed_when: yay_build.rc == 0

- name: Clean up yay build directory
  ansible.builtin.file:
    path: /tmp/yay-bin
    state: absent
  when: yay_check.rc != 0
