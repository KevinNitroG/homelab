---
- name: Ensure tmux config directory exists
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/tmux"
    state: directory
    mode: "0755"

- name: Deploy tmux configuration
  ansible.builtin.template:
    src: tmux.conf.j2
    dest: "{{ target_user_home }}/.config/tmux/tmux.conf"
    mode: "0644"
    force: true

# noqa: latest[git]
- name: Install/update TPM (Tmux Plugin Manager)
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ target_user_home }}/.config/tmux/plugins/tpm"
    depth: 1
    update: true
