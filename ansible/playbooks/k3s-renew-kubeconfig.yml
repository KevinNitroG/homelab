---
- name: Renew K3s admin credentials and refresh workstation kubeconfig
  hosts: server
  gather_facts: false
  any_errors_fatal: true
  vars:
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
    kubeconfig_users:
      - kevblink
      - kevblink-local
    k3s_renewal_window_seconds: 10368000
    k3s_allow_restart: false
  tasks:
    - name: Require one server and a normal playbook run
      ansible.builtin.assert:
        that:
          - groups['server'] | length == 1
          - not ansible_check_mode
        fail_msg: This playbook requires exactly one server and does not support check mode.

    - name: Check K3s admin certificate expiry
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - /var/lib/rancher/k3s/server/tls/client-admin.crt
          - -noout
          - -checkend
          - "{{ k3s_renewal_window_seconds | string }}"
      register: admin_certificate_check
      changed_when: false
      failed_when: admin_certificate_check.rc not in [0, 1]

    - name: Require approval before restarting K3s
      ansible.builtin.assert:
        that:
          - admin_certificate_check.rc == 0 or k3s_allow_restart | bool
        fail_msg: >-
          The admin certificate expires within 120 days. Schedule downtime and
          rerun with -e k3s_allow_restart=true to restart K3s and renew it.

    - name: Restart K3s when the admin certificate needs renewal
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
      when: admin_certificate_check.rc == 1

    - name: Verify renewed admin certificate
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - /var/lib/rancher/k3s/server/tls/client-admin.crt
          - -noout
          - -checkend
          - "{{ k3s_renewal_window_seconds | string }}"
      changed_when: false

    - name: Read server kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: server_kubeconfig
      no_log: true

    - name: Extract server admin credentials
      ansible.builtin.set_fact:
        server_admin: "{{ ((server_kubeconfig.content | b64decode | from_yaml).users | selectattr('name', 'equalto', 'default') | first).user }}"
      no_log: true

    - name: Read workstation kubeconfig
      ansible.builtin.slurp:
        src: "{{ kubeconfig_path }}"
      delegate_to: localhost
      become: false
      register: workstation_kubeconfig
      no_log: true

    - name: Identify workstation credentials requiring an update
      ansible.builtin.set_fact:
        workstation_users: "{{ (workstation_kubeconfig.content | b64decode | from_yaml).users }}"
        users_to_update: []
      no_log: true

    - name: Ensure both workstation users exist
      ansible.builtin.assert:
        that:
          - item in (workstation_users | map(attribute='name') | list)
        fail_msg: "Kubeconfig user {{ item }} does not exist; no changes were made."
      loop: "{{ kubeconfig_users }}"

    - name: Select outdated workstation users
      ansible.builtin.set_fact:
        users_to_update: "{{ users_to_update + [item] }}"
      loop: "{{ kubeconfig_users }}"
      vars:
        current_user: "{{ (workstation_users | selectattr('name', 'equalto', item) | first).user }}"
      when: >-
        current_user['client-certificate-data'] | default('') != server_admin['client-certificate-data']
        or current_user['client-key-data'] | default('') != server_admin['client-key-data']
      no_log: true

    - name: Refresh workstation credentials
      when: users_to_update | length > 0
      delegate_to: localhost
      become: false
      block:
        - name: Back up workstation kubeconfig
          ansible.builtin.copy:
            src: "{{ kubeconfig_path }}"
            dest: "{{ kubeconfig_path }}.backup.{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
            remote_src: true
            mode: "0600"

        - name: Create private temporary directory
          ansible.builtin.tempfile:
            state: directory
            prefix: k3s-credentials-
          register: credential_directory

        - name: Write temporary client certificate
          ansible.builtin.copy:
            content: "{{ server_admin['client-certificate-data'] | b64decode }}"
            dest: "{{ credential_directory.path }}/client.crt"
            mode: "0600"
          no_log: true

        - name: Write temporary client key
          ansible.builtin.copy:
            content: "{{ server_admin['client-key-data'] | b64decode }}"
            dest: "{{ credential_directory.path }}/client.key"
            mode: "0600"
          no_log: true

        - name: Update workstation users
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - "{{ kubeconfig_path }}"
              - config
              - set-credentials
              - "{{ item }}"
              - "--client-certificate={{ credential_directory.path }}/client.crt"
              - "--client-key={{ credential_directory.path }}/client.key"
              - --embed-certs=true
          loop: "{{ users_to_update }}"
          no_log: true
          changed_when: true
      always:
        - name: Remove temporary credentials
          ansible.builtin.file:
            path: "{{ credential_directory.path }}"
            state: absent
          when: credential_directory.path is defined
